<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <link rel="stylesheet" href="style.css">
</head>



<body>

    <div class="form-box">

        <h2>Student Registration</h2>
        <p>Enter your details below</p>

        <form>

            <label>Name</label>
            <input type="text" placeholder="Enter your name" required>

            <label>Department</label>
            <input type="text" placeholder="Enter your department" required>

            <label>Register Number</label>
            <input type="text" placeholder="Enter register number" required>

            <label>Mail ID</label>
            <input type="email" placeholder="Enter your mail ID" required>

            <label>Phone Number</label>
            <input type="tel" placeholder="Enter your phone number" required>
             <label>Father Name</label>
            <input type="text" placeholder="Enter your father name" required>
 <label>Mother Name</label>
            <input type="text" placeholder="Enter your Mother Name" required>
 <label>Roll no</label>
            <input type="number" placeholder="Enter your roll number" required>
 <label>Address</label>
            <input type="text" placeholder="Enter your address" required>


            <button type="submit">Register</button>

        </form>

    </div>

</body>
</html>
