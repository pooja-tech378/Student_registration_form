<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Student Registration</title>

    <link rel="stylesheet" href="style1.css">
</head>

<body>

    <div class="form-container">

        <h1>College Student Registration Form</h1>

        <form>

            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name">

            <label for="regno">Register Number</label>
            <input type="text" id="regno" name="regno" placeholder="Enter register number">

            <label for="department">Department</label>
            <select id="department" name="department">
                <option value="">Select Department</option>
                <option value="cse">Computer Science Engineering</option>
                <option value="ece">Electronics and Communication Engineering</option>
                <option value="eee">Electrical and Electronics Engineering</option>
                <option value="mech">Mechanical Engineering</option>
                <option value="civil">Civil Engineering</option>
            </select>

            <label for="email">Email ID</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter phone number">

            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob">

            <label>Gender</label>
            <div class="gender">
                <label>
                    <input type="radio" name="gender" value="male">
                    Male
                </label>

                <label>
                    <input type="radio" name="gender" value="female">
                    Female
                </label>
            </div>

            <label for="place">Place</label>
            <input type="text" id="place" name="place" placeholder="Enter your place">

            <label for="address">Address</label>
            <textarea id="address" name="address" rows="4"
                placeholder="Enter your address"></textarea>

            <label for="dept">Department</label>
            <select id="dept" name="dept">
                <option value="">Select Department</option>
                <option value="cse">CSE</option>
                <option value="ece">ECE</option>
                <option value="eee">EEE</option>
                <option value="mech">Mechanical</option>
                <option value="civil">Civil</option>
            </select>

            <label>Skills</label>

            <div class="skills">
                <label>
                    <input type="checkbox" name="skills" value="java">
                    Java
                </label>

                <label>
                    <input type="checkbox" name="skills" value="python">
                    Python
                </label>

                <label>
                    <input type="checkbox" name="skills" value="html">
                    HTML
                </label>

                <label>
                    <input type="checkbox" name="skills" value="css">
                    CSS
                </label>

                <label>
                    <input type="checkbox" name="skills" value="javascript">
                    JavaScript
                </label>
            </div>

            <div class="buttons">
                <button type="submit" class="register-btn">
                    Register
                </button>

                <button type="reset" class="reset-btn">
                    Reset
                </button>
            </div>

        </form>

    </div>

</body>
</html>
